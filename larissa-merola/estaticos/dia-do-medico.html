<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Dia do Médico</title>
<link rel="stylesheet" href="../capa/fonts/fonts.css">
<link rel="stylesheet" href="../capa/tokens.css">
<style>
  html, body { margin: 0; background: #ddd; }
  .slide { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: var(--musgo); color: var(--branco); font-family: var(--sans); }
  .foto { position: absolute; inset: 0; }
  .foto img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 0; }
  .veu { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(52,59,48,0) 38%, rgba(52,59,48,.55) 58%, rgba(52,59,48,.96) 78%, var(--musgo) 100%); }
  .faixa { position: absolute; top: 0; left: 0; width: 1080px; height: 26px; }
  .data { position: absolute; left: 96px; top: 70px; font-size: 22px; font-weight: 500; letter-spacing: 0.28em; text-transform: uppercase; color: var(--branco); opacity: .9; text-shadow: 0 1px 8px rgba(0,0,0,.25); }
  .texto { position: absolute; left: 96px; right: 96px; bottom: 250px; display: flex; flex-direction: column; gap: 22px; }
  .texto .pre { font-size: 30px; font-weight: 500; letter-spacing: 0.02em; color: var(--saude); }
  .texto h1 { margin: 0; font-family: var(--serif); font-size: 128px; line-height: .96; letter-spacing: -0.02em; font-weight: 400; text-wrap: balance; }
  .texto p { margin: 8px 0 0; font-size: 29px; line-height: 1.42; max-width: 760px; }
  .linha { width: 120px; height: 4px; background: var(--saude); margin-top: 10px; }
  .logo { position: absolute; left: 96px; bottom: 96px; }
  .logo img { height: 96px; display: block; }
  .arroba { position: absolute; right: 96px; bottom: 118px; font-size: 24px; color: var(--saude); font-weight: 500; }
</style>
</head>
<body>
<div class="slide">
  <div class="foto"><img src="../banco/doutora/doutora-02.jpg" alt=""></div>
  <div class="veu"></div>
  <svg class="faixa" viewBox="0 0 1080 26" preserveAspectRatio="none" aria-hidden="true">
    <rect width="1080" height="26" fill="#78856F"/>
    <path d="M0 26 C 120 -30, 260 -30, 380 26 Z" fill="#CCD77F"/>
    <path d="M300 26 C 420 -34, 560 -34, 690 26 Z" fill="#343B30"/>
    <path d="M620 26 C 740 -30, 880 -30, 1000 26 Z" fill="#CCD77F"/>
    <path d="M900 26 C 980 -24, 1060 -24, 1140 26 Z" fill="#343B30"/>
    <rect y="22" width="1080" height="4" fill="#343B30"/>
  </svg>
  <div class="data">18 de outubro</div>
  <div class="texto">
    <div class="pre">Feliz</div>
    <h1>Dia do Médico</h1>
    <div class="linha"></div>
    <p>Investigar antes de tratar. Ouvir antes de prescrever. É assim que a gente cuida de cada paciente que senta na nossa frente.</p>
  </div>
  <div class="logo"><img src="../capa/logo-branca.png" alt="Dra. Larissa Merola"></div>
  <div class="arroba">@larissamerola</div>
</div>
<script src="../capa/tipografia.js"></script>
</body>
</html>
