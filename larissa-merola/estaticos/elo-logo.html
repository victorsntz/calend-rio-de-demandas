<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Elo Lipedema, logo</title>
<link rel="stylesheet" href="../capa/fonts/fonts.css"><link rel="stylesheet" href="../capa/tokens.css">
<style>
  html, body { margin: 0; background: #ddd; }
  .arte { width: 3000px; height: 3000px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-family: var(--sans); margin-bottom: 40px; }
  .arte.branca { background: #FFFFFF; color: var(--musgo); }
  .arte.verde { background: var(--musgo); color: #FFFFFF; }
  .arte .iso { width: 360px; height: auto; }
  .arte .elo { font-family: var(--serif); font-size: 880px; line-height: .86; letter-spacing: 0.02em; margin-top: 70px; }
  .arte .lipedema { font-size: 170px; font-weight: 300; letter-spacing: 0.44em; text-transform: uppercase; padding-left: 0.44em; margin-top: 60px; }
  .arte .risco { width: 200px; height: 9px; background: var(--saude); margin: 120px 0 90px; }
  .arte .por { font-size: 70px; letter-spacing: 0.3em; text-transform: uppercase; font-weight: 500; }
</style></head><body>
<div class="arte branca" id="elo-logo-fundo-branco"><img class="iso" src="../capa/isotipo.svg" alt=""><div class="elo">ELO</div><div class="lipedema">Lipedema</div><div class="risco"></div><div class="por">por Dra. Larissa Merola</div></div>
<div class="arte verde" id="elo-logo-fundo-verde"><img class="iso" src="../capa/isotipo-branco.svg" alt=""><div class="elo">ELO</div><div class="lipedema">Lipedema</div><div class="risco"></div><div class="por">por Dra. Larissa Merola</div></div>
</body></html>
